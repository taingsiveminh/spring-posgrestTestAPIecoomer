server.port=${PORT:8080}

# Default (dev-friendly) datasource: in-memory H2
# To use Postgres instead: run with `--spring.profiles.active=postgres`
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2
