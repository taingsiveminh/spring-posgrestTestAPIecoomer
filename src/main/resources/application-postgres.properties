# Postgres profile
# Start Postgres (e.g. via docker-compose) then run Spring Boot with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# or
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=postgres

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}
